services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Configure external PostgreSQL}
      REDIS_URL: ${REDIS_URL:?Configure private Redis}
      AUTH_SECRET: ${AUTH_SECRET:?Configure random secret}
      APP_URL: ${APP_URL:?Configure HTTPS public origin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Configure external PostgreSQL}
      REDIS_URL: ${REDIS_URL:?Configure private Redis}
    command: ["npm","run","worker"]
    restart: unless-stopped
