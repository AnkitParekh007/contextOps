services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Configure external PostgreSQL}
      REDIS_URL: ${REDIS_URL:?Configure private Redis}
      AUTH_SECRET: ${AUTH_SECRET:?Configure random secret}
      APP_URL: ${APP_URL:?Configure HTTPS public origin}
      PILOT_INVITE_CODE: ${PILOT_INVITE_CODE:?Configure private invite code}
      RESEND_API_KEY: ${RESEND_API_KEY:?Configure verified transactional-email provider}
      EMAIL_FROM: ${EMAIL_FROM:?Configure verified sender address}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Configure 64-hex-digit 32-byte encryption key}
      OPS_MONITOR_TOKEN: ${OPS_MONITOR_TOKEN:?Configure a strong monitoring token}
      OPS_QUEUE_WARN_SECONDS: ${OPS_QUEUE_WARN_SECONDS:-300}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Configure external PostgreSQL}
      REDIS_URL: ${REDIS_URL:?Configure private Redis}
    command: ["npm","run","worker"]
    restart: unless-stopped
