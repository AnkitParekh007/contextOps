    <meta name="theme-color" content="#232325" />
    <script>
      /* Apply persisted color scheme before CSS paints to avoid a theme flash. */
      (function(){
        var preference="system";
        try {
          var value=window.localStorage.getItem("contextops-theme");
          if(value==="light"||value==="dark"||value==="system")preference=value;
        } catch(e) {}
        var dark=window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var resolved=preference==="system"?(dark?"dark":"light"):preference;
        document.documentElement.dataset.themePreference=preference;
        document.documentElement.dataset.theme=resolved;
        document.documentElement.style.colorScheme=resolved;
      })();
    </script>
