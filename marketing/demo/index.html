<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#232325"/>
<meta name="robots" content="index,follow"/>
<meta name="description" content="Try ContextOps AI in your browser with 500 synthetic support tickets, a deterministic MOCK evaluation, safe offline routing simulation and downloadable assessment. No sign-in or customer data."/>
<link rel="canonical" href="https://ankitparekh007.github.io/contextOps/demo/"/>
<link rel="icon" href="/contextOps/favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<title>Try the synthetic assessment · ContextOps AI</title>
<script>
  (function(){
    var p="system";try{var v=localStorage.getItem("contextops-theme");if(["light","dark","system"].includes(v))p=v;}catch(e){}
    var dark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
    var t=p==="system"?(dark?"dark":"light"):p;
    document.documentElement.dataset.themePreference=p;
    document.documentElement.dataset.theme=t;
    document.documentElement.style.colorScheme=t;
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/demo-main.tsx"></script>
</body>
</html>
