name: Marketing Website · Build & GitHub Pages

on:
  pull_request:
    paths:
      - "marketing/**"
      - "src/lib/marketing-content.ts"
      - "src/lib/pipeline/cost.ts"
      - ".github/workflows/marketing-pages.yml"
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - "src/lib/marketing-content.ts"
      - "src/lib/pipeline/cost.ts"
      - ".github/workflows/marketing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install marketing dependencies
        working-directory: marketing
        run: npm install --no-audit --no-fund
      - name: Typecheck and build static React website
        working-directory: marketing
        run: npm run build
      - name: Verify GitHub Pages artifact
        run: |
          test -f marketing/dist/index.html
          test -f marketing/dist/favicon.svg
          test -f marketing/dist/sitemap.xml
          grep -q 'contextOps/assets/' marketing/dist/index.html
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: marketing/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static marketing site
        id: deployment
        uses: actions/deploy-pages@v4
