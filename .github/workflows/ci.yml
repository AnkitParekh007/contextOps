name: ContextOps AI CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contextops
          POSTGRES_PASSWORD: contextops_local
          POSTGRES_DB: contextops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contextops -d contextops"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://contextops:contextops_local@localhost:5432/contextops?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci_only_change_me_32_character_secret_00001
      APP_URL: http://localhost:3000
      PILOT_INVITE_CODE: ci_only_pilot_invitation_code_nonproduction_00001
      MFA_ENCRYPTION_KEY: 8a5e11223344556677889900aabbccddeeff00112233445566778899aabbccdd
      OPS_MONITOR_TOKEN: synthetic_ci_monitor_token_32plus_864f7eab
      OPS_QUEUE_WARN_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply migrations
        run: npm run db:deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Build and boot the actual production worker image
        run: |
          docker build -f Dockerfile.production -t contextops-worker-ci:latest .
          cid=$(docker run -d --network host -e DATABASE_URL -e REDIS_URL contextops-worker-ci:latest npm run worker)
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          sleep 7
          if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
            docker logs "$cid" --tail 70
            exit 1
          fi
          docker logs "$cid" --tail 15
      - name: Runtime smoke test
        run: |
          npm run start > /tmp/contextops-app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke.mjs || (cat /tmp/contextops-app.log && exit 1)
      - name: Full pilot smoke test (import worker, analysis, evaluation, shadow, report)
        run: |
          npm run worker > /tmp/contextops-worker.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://localhost:3000/api/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/ready || (cat /tmp/contextops-worker.log && exit 1)
          node scripts/hosted-acceptance.mjs || (cat /tmp/contextops-app.log && cat /tmp/contextops-worker.log && exit 1)
          node scripts/pilot-smoke.mjs || (cat /tmp/contextops-app.log && cat /tmp/contextops-worker.log && exit 1)
      - name: Phase 17 synthetic operational readiness probe
        run: npm run smoke:operations
      - name: Verify Phase 17 report remains explicitly unapproved
        run: |
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync("artifacts/phase17-operational-readiness.json","utf8")); if(r.status!=="PASS"||r.scope!=="synthetic_ci_only"||r.productionApproved!==false||r.customerDataApproved!==false||r.verifiedSavings!==false||r.backupsVerified!==false||r.emailVerified!==false||r.alertsVerified!==false)process.exit(1);'
      - name: Phase 14 synthetic tenant and benchmark acceptance
        env:
          PHASE14_OUTPUT_DIR: artifacts
        run: node scripts/phase14-acceptance.mjs
      - name: Verify sanitized Phase 14 evidence contract
        run: node scripts/verify-phase14-evidence.mjs
      - name: Phase 15 fail-closed release readiness
        run: npx tsx scripts/phase15-readiness.ts
      - name: Retention cascade and identity cleanup smoke
        run: npx tsx scripts/retention-smoke.ts
      - name: PostgreSQL synthetic backup and isolated restore drill
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash scripts/verify-backup-restore.sh

      - name: Upload sanitized Phase 14 acceptance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-synthetic-acceptance
          path: |
            artifacts/phase14-synthetic-acceptance.json
            artifacts/phase14-synthetic-acceptance.md
            artifacts/phase15-pilot-readiness.json
            artifacts/phase17-operational-readiness.json
          retention-days: 14
          if-no-files-found: warn
